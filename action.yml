name: SAM Doctor AWS Deployment Diagnostics
author: Jake Goldstein
description: Diagnose AWS SAM, CDK, CloudFormation, and GitHub Actions deployment failures with redacted reports.
inputs:
  log-file:
    description: Path to the deployment log to diagnose.
    required: true
    type: string
  run-command:
    description: Optional Bash command to run, capture, and diagnose in this step.
    required: false
    type: string
  summary:
    description: Add the redacted Markdown report to the GitHub Actions job summary.
    required: false
    type: boolean
    default: false
  annotations:
    description: Add redacted GitHub Actions notice(s) for every supported finding.
    required: false
    type: boolean
    default: true
  batch:
    description: Diagnose multiple files from a directory or glob path using batch mode.
    required: false
    type: boolean
    default: false
  fail-on-findings:
    description: Fail the action when one or more supported findings are detected.
    required: false
    type: boolean
    default: false
  fail-on-confidence:
    description: >-
      Fail the action only when a finding at this confidence or above is
      detected ("high" or "medium"). Reports and outputs still include every
      finding; only the exit status is gated. Works with or without
      fail-on-findings, and it takes precedence: when set, it decides the exit
      status on its own and fail-on-findings is not consulted. That is how a
      team gates on high confidence first and tightens later - but it also
      means adding fail-on-confidence: high to a job already running
      fail-on-findings: true makes the gate more permissive, not less, because
      medium findings stop failing the build.
    required: false
    type: string
    default: ""
outputs:
  finding-count:
    description: Number of supported findings in the supplied log.
    value: ${{ steps.diagnose.outputs.finding-count }}
  has-findings:
    description: Whether the supplied log contains one or more supported findings.
    value: ${{ steps.diagnose.outputs.has-findings }}
  sam-doctor-version:
    description: Version string reported by the executed sam-doctor package.
    value: ${{ steps.diagnose.outputs.sam-doctor-version }}
  deploy-exit-status:
    description: Exit status of the optional run-command (0 when run-command is not used).
    value: ${{ steps.diagnose.outputs.deploy-exit-status }}
branding:
  icon: activity
  color: yellow
runs:
  using: composite
  steps:
    - id: diagnose
      name: Diagnose deployment log
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        SAM_DOCTOR_LOG_FILE: ${{ inputs.log-file }}
        SAM_DOCTOR_RUN_COMMAND: ${{ inputs.run-command }}
        SAM_DOCTOR_SUMMARY: ${{ inputs.summary }}
        SAM_DOCTOR_ANNOTATIONS: ${{ inputs.annotations }}
        SAM_DOCTOR_BATCH: ${{ inputs.batch }}
        SAM_DOCTOR_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        SAM_DOCTOR_FAIL_ON_CONFIDENCE: ${{ inputs.fail-on-confidence }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-github-action.sh"
