name: SAM Doctor AWS Deployment Diagnostics
author: Jake Goldstein
description: Diagnose AWS SAM, CDK, CloudFormation, and GitHub Actions deployment logs; can add a redacted report to the job summary.
inputs:
  log-file:
    description: Path to the deployment log to diagnose.
    required: true
    type: string
  summary:
    description: Add the redacted Markdown report to the GitHub Actions job summary.
    required: false
    type: boolean
    default: false
  annotations:
    description: Add redacted GitHub Actions notice(s) for every supported finding.
    required: false
    type: boolean
    default: true
  batch:
    description: Diagnose multiple files from a directory or glob path using batch mode.
    required: false
    type: boolean
    default: false
  fail-on-findings:
    description: Fail the action when one or more supported findings are detected.
    required: false
    type: boolean
    default: false
  fail-on-confidence:
    description: >-
      Only let fail-on-findings trip on findings at or above this confidence
      ("medium" or "high"). Leave empty to fail on any finding, unchanged
      from prior behavior. The job summary and annotations still show every
      finding regardless of this setting.
    required: false
    type: string
    default: ""
outputs:
  finding-count:
    description: Number of supported findings in the supplied log.
    value: ${{ steps.diagnose.outputs.finding-count }}
  has-findings:
    description: Whether the supplied log contains one or more supported findings.
    value: ${{ steps.diagnose.outputs.has-findings }}
  sam-doctor-version:
    description: Version string reported by the executed sam-doctor package.
    value: ${{ steps.diagnose.outputs.sam-doctor-version }}
branding:
  icon: activity
  color: yellow
runs:
  using: composite
  steps:
    - id: diagnose
      name: Diagnose deployment log
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        SAM_DOCTOR_LOG_FILE: ${{ inputs.log-file }}
        SAM_DOCTOR_SUMMARY: ${{ inputs.summary }}
        SAM_DOCTOR_ANNOTATIONS: ${{ inputs.annotations }}
        SAM_DOCTOR_BATCH: ${{ inputs.batch }}
        SAM_DOCTOR_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        SAM_DOCTOR_FAIL_ON_CONFIDENCE: ${{ inputs.fail-on-confidence }}
      run: bash "$GITHUB_ACTION_PATH/scripts/run-github-action.sh"
