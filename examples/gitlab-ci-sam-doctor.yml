image: python:3.11

stages:
  - deploy

deploy-and-diagnose:
  stage: deploy
  script:
    - pip install sam-doctor --quiet
    # Replace this with your real deployment command.
    - |
      set -o pipefail
      set +e
      sam deploy --no-confirm-changeset 2>&1 | tee deployment.log
      deploy_status=${PIPESTATUS[0]}
      set -e
      if [ "$deploy_status" -ne 0 ]; then
        set +e
        sam-doctor diagnose deployment.log --format json --output diagnosis.json
        set -e
      fi
      exit "$deploy_status"
