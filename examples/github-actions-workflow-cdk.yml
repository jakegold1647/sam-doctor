name: Diagnose CDK deployment failures

on:
  push:
    branches: [main]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AWS CDK dependencies
        run: npm install
      - name: Deploy
        shell: bash
        run: |
          set -o pipefail
          npx cdk deploy --all --require-approval never 2>&1 | tee deployment.log
      - name: Diagnose deployment log
        if: always()
        id: sam-doctor
        uses: jakegold1647/sam-doctor@v0
        with:
          log-file: deployment.log
          summary: true
