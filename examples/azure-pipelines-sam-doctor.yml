trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
  - bash: |
      python -m pip install --upgrade pip
      pip install sam-doctor
      # Replace this with your deployment command.
      set -o pipefail
      set +e
      sam deploy --no-confirm-changeset 2>&1 | tee deployment.log
      deploy_status=${PIPESTATUS[0]}
      set -e
      if [ "$deploy_status" -ne 0 ]; then
        set +e
        sam-doctor diagnose deployment.log --format json --output diagnosis.json
        set -e
      fi
      exit "$deploy_status"
    displayName: "Deploy and diagnose"
