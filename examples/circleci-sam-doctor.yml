version: 2.1

jobs:
  deploy-and-diagnose:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Run deployment and diagnose
          command: |
            pip install sam-doctor
            # Replace with your real deployment command.
            set -o pipefail
            set +e
            sam deploy --no-confirm-changeset 2>&1 | tee deployment.log
            deploy_status=${PIPESTATUS[0]}
            set -e
            if [ "$deploy_status" -ne 0 ]; then
              sam-doctor diagnose deployment.log --format json --output diagnosis.json
            fi
            exit "$deploy_status"

workflows:
  deploy-and-diagnose:
    jobs:
      - deploy-and-diagnose
