name: Comment the first SAM Doctor finding (template)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep deployment capture in a separate workflow or add your own safe,
      # credential-free fixture here. This example only demonstrates diagnosis
      # and the opt-in comment boundary.
      - name: Write a supported example excerpt
        shell: bash
        run: |
          printf '%s\n' 'Error: Not authorized to perform: sts:AssumeRoleWithWebIdentity' > deployment.log

      - name: Diagnose deployment log
        if: always()
        id: sam-doctor
        uses: jakegold1647/sam-doctor@v0
        with:
          log-file: deployment.log
          summary: true
          first-finding-report: sam-doctor-first-finding.md

      # Fork PRs never reach this step. A same-repository PR without write
      # permission keeps its job summary; the comment attempt is non-blocking.
      - name: Create or update the first-finding comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- sam-doctor:first-finding -->";
            const report = fs.readFileSync("sam-doctor-first-finding.md", "utf8");
            const body = marker + "\n" + report;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (comment) =>
                comment.user.type === "Bot" && comment.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
