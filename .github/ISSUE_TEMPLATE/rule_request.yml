name: Request a diagnostic rule
description: Suggest a failure pattern SAM Doctor should support.
title: "rule: "
labels: ["rule request"]
body:
  - type: markdown
    attributes:
      value: |
        Do not post raw logs, AWS account IDs, ARNs, access keys, session tokens,
        customer data, or private repository names. A short, sanitized error is enough.
        Include the command where the failure appeared and one expected safe next check.

        Want to implement a rule yourself? The
        [rule roadmap](https://github.com/jakegold1647/sam-doctor/blob/main/docs/rule-roadmap.md)
        lists pre-specified candidates you can claim, and
        [Contributing a diagnostic rule](https://github.com/jakegold1647/sam-doctor/blob/main/docs/contributing-a-diagnostic-rule.md)
        walks through a full example PR. Say "I'd like to take this" and we will assign it to you.
  - type: input
    id: service
    attributes:
      label: AWS or CI service
      placeholder: CloudFormation, IAM, API Gateway, GitHub Actions, or AWS SAM
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Deployment command used
      description: >
        The exact command family that produced the failure (for example `sam deploy`,
        `sam sync`, `aws cloudformation deploy`, etc).
      placeholder: sam deploy --no-confirm-changeset
    validations:
      required: true
  - type: textarea
    id: excerpt
    attributes:
      label: Sanitized error excerpt
      description: Include the first useful error, not an entire log.
    validations:
      required: true
  - type: textarea
    id: next_check
    attributes:
      label: Useful next check
      description: What should a safe, evidence-based report ask a developer to verify?
    validations:
      required: true
  - type: dropdown
    id: redaction_confirmed
    attributes:
      label: Has the excerpt been sanitized?
      description: Check this before submitting to avoid exposing sensitive identifiers.
      options:
        - "Yes"
        - "Not sure - please review"
    validations:
      required: true
