name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-launch-readiness.py --repo jakegold1647/sam-doctor --token "${{ github.token }}"
      - run: python -m pip install build
      - run: python -m build
      - name: Create release with package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$TAG" == *-* ]]; then
            release_flags=(--prerelease)
          else
            release_flags=()
          fi

          notes_file="launch/RELEASE-${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping publish step."
            exit 0
          fi

          if [ -f "$notes_file" ]; then
            gh release create "$TAG" dist/* "${release_flags[@]}" --title "SAM Doctor ${TAG}" --notes-file "$notes_file"
          else
            gh release create "$TAG" dist/* "${release_flags[@]}" --title "SAM Doctor ${TAG}" --generate-notes
          fi
