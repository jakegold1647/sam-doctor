name: Publish release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing release tag to publish (for example, v0.12.0)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-publishing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      tag_commit: ${{ steps.resolve.outputs.tag_commit }}
      default_branch: ${{ steps.resolve.outputs.default_branch }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      wheel_name: ${{ steps.package.outputs.wheel_name }}
      wheel_sha256: ${{ steps.package.outputs.wheel_sha256 }}
      sdist_name: ${{ steps.package.outputs.sdist_name }}
      sdist_sha256: ${{ steps.package.outputs.sdist_sha256 }}
    steps:
      - name: Resolve a reviewed release commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be a canonical vMAJOR.MINOR.PATCH tag with an optional prerelease suffix." >&2
            exit 1
          fi

          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          if [[ -z "$default_branch" || "$GITHUB_REF" != "refs/heads/${default_branch}" ]]; then
            echo "Publish release must be dispatched from the current default branch." >&2
            exit 1
          fi

          encoded_default_branch=$(printf '%s' "$default_branch" | jq -sRr @uri)
          default_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_default_branch}")
          default_type=$(jq -r '.object.type' <<< "$default_ref")
          default_commit=$(jq -r '.object.sha' <<< "$default_ref")
          if [[ "$default_type" != "commit" || ! "$default_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The default branch did not resolve to an immutable commit." >&2
            exit 1
          fi
          if [[ "$WORKFLOW_SHA" != "$default_commit" ]]; then
            echo "The dispatched workflow is stale relative to the default-branch head; dispatch it again." >&2
            exit 1
          fi

          encoded_tag=$(printf '%s' "$RELEASE_TAG" | jq -sRr @uri)
          tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}")
          if [[ "$(jq -r '.ref' <<< "$tag_ref")" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "GitHub returned a different tag than the one requested." >&2
            exit 1
          fi
          target_type=$(jq -r '.object.type' <<< "$tag_ref")
          tag_commit=$(jq -r '.object.sha' <<< "$tag_ref")
          for _ in 1 2 3 4 5; do
            if [[ "$target_type" == "commit" ]]; then
              break
            fi
            if [[ "$target_type" != "tag" || ! "$tag_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Release tag did not resolve to a commit." >&2
              exit 1
            fi
            tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_commit}")
            target_type=$(jq -r '.object.type' <<< "$tag_object")
            tag_commit=$(jq -r '.object.sha' <<< "$tag_object")
          done
          if [[ "$target_type" != "commit" || ! "$tag_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release tag did not resolve to a commit within five tag objects." >&2
            exit 1
          fi

          comparison=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...${default_commit}")
          if [[ "$(jq -r '.merge_base_commit.sha' <<< "$comparison")" != "$tag_commit" ]]; then
            echo "Release tag must point to the current default branch or one of its reviewed ancestors." >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'tag_commit=%s\n' "$tag_commit" >> "$GITHUB_OUTPUT"
          printf 'default_branch=%s\n' "$default_branch" >> "$GITHUB_OUTPUT"
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.tag_commit }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python scripts/sync-site-metadata.py --check
      - name: Check tagged release readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: >-
          python scripts/check-launch-readiness.py
          --repo jakegold1647/sam-doctor
          --token "$GITHUB_TOKEN"
          --tag "$RELEASE_TAG"
      - run: python -m pip install build
      - run: python -m build
      - name: Validate and fingerprint package artifacts
        id: package
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          import tarfile
          import tomllib
          import zipfile
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path

          from packaging.version import Version

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          version = project["version"]
          if project["name"] != "sam-doctor" or os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("tag, project name, and package version must agree")
          normalized = str(Version(version))
          expected = {
              "wheel": Path("dist") / f"sam_doctor-{normalized}-py3-none-any.whl",
              "sdist": Path("dist") / f"sam_doctor-{normalized}.tar.gz",
          }
          files = sorted(path for path in Path("dist").iterdir() if path.is_file())
          if files != sorted(expected.values()):
              raise SystemExit(f"dist must contain exactly the canonical wheel and source archive: {files}")

          def metadata_values(payload: bytes) -> tuple[str, str]:
              message = BytesParser(policy=policy.default).parsebytes(payload)
              names = message.get_all("Name", [])
              versions = message.get_all("Version", [])
              if len(names) != 1 or len(versions) != 1:
                  raise SystemExit("package metadata must contain one Name and Version")
              return str(names[0]), str(versions[0])

          wheel_metadata = f"sam_doctor-{normalized}.dist-info/METADATA"
          with zipfile.ZipFile(expected["wheel"]) as archive:
              if archive.namelist().count(wheel_metadata) != 1:
                  raise SystemExit("wheel contains unexpected metadata layout")
              wheel_values = metadata_values(archive.read(wheel_metadata))

          sdist_metadata = f"sam_doctor-{normalized}/PKG-INFO"
          with tarfile.open(expected["sdist"], mode="r:gz") as archive:
              matches = [member for member in archive if member.name == sdist_metadata]
              if len(matches) != 1 or not matches[0].isfile():
                  raise SystemExit("source archive contains unexpected metadata layout")
              extracted = archive.extractfile(matches[0])
              if extracted is None:
                  raise SystemExit("source archive metadata could not be read")
              sdist_values = metadata_values(extracted.read())

          wanted = ("sam-doctor", normalized)
          if wheel_values != wanted or sdist_values != wanted:
              raise SystemExit("built package metadata does not match the requested release")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8", newline="\n") as handle:
              for kind, path in expected.items():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  handle.write(f"{kind}_name={path.name}\n")
                  handle.write(f"{kind}_sha256={digest}\n")
          PY
      - name: Transfer verified distributions to the release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-distributions
          path: |
            dist/${{ steps.package.outputs.wheel_name }}
            dist/${{ steps.package.outputs.sdist_name }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - name: Download this run's verified distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name release-distributions \
            --dir dist

      - name: Recheck transferred artifact identities
        env:
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$WHEEL_NAME" =~ ^sam_doctor-[0-9A-Za-z.+]+-py3-none-any\.whl$ ||
                ! "$SDIST_NAME" =~ ^sam_doctor-[0-9A-Za-z.+]+\.tar\.gz$ ||
                ! "$WHEEL_SHA256" =~ ^[0-9a-f]{64}$ ||
                ! "$SDIST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Build outputs were not canonical package identities." >&2
            exit 1
          fi
          mapfile -d '' files < <(find dist -maxdepth 1 -type f -print0)
          if [[ ${#files[@]} -ne 2 || ! -f "dist/${WHEEL_NAME}" || ! -f "dist/${SDIST_NAME}" ]]; then
            echo "Downloaded artifact must contain exactly the verified wheel and source archive." >&2
            exit 1
          fi
          printf '%s  %s\n' "$WHEEL_SHA256" "dist/${WHEEL_NAME}" | sha256sum --check --strict
          printf '%s  %s\n' "$SDIST_SHA256" "dist/${SDIST_NAME}" | sha256sum --check --strict

      - name: Create or verify the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          TAG_COMMIT: ${{ needs.build.outputs.tag_commit }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          WHEEL_NAME: ${{ needs.build.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
          SDIST_NAME: ${{ needs.build.outputs.sdist_name }}
          SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
        run: |
          set -euo pipefail

          resolve_tag_commit() {
            local encoded_tag tag_ref target_type target_sha tag_object
            encoded_tag=$(printf '%s' "$RELEASE_TAG" | jq -sRr @uri)
            tag_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${encoded_tag}")
            if [[ "$(jq -r '.ref' <<< "$tag_ref")" != "refs/tags/${RELEASE_TAG}" ]]; then
              return 1
            fi
            target_type=$(jq -r '.object.type' <<< "$tag_ref")
            target_sha=$(jq -r '.object.sha' <<< "$tag_ref")
            for _ in 1 2 3 4 5; do
              if [[ "$target_type" == "commit" ]]; then
                break
              fi
              if [[ "$target_type" != "tag" || ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
                return 1
              fi
              tag_object=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${target_sha}")
              target_type=$(jq -r '.object.type' <<< "$tag_object")
              target_sha=$(jq -r '.object.sha' <<< "$tag_object")
            done
            if [[ "$target_type" != "commit" || ! "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
              return 1
            fi
            printf '%s' "$target_sha"
          }

          current_tag_commit=$(resolve_tag_commit)
          if [[ "$current_tag_commit" != "$TAG_COMMIT" ]]; then
            echo "Release tag moved after the read-only build completed." >&2
            exit 1
          fi

          wheel_size=$(stat -c '%s' "dist/${WHEEL_NAME}")
          sdist_size=$(stat -c '%s' "dist/${SDIST_NAME}")
          encoded_tag=$(printf '%s' "$RELEASE_TAG" | jq -sRr @uri)

          verify_release() {
            jq -e \
              --arg tag "$RELEASE_TAG" \
              --argjson prerelease "$PRERELEASE" \
              --arg wheel_name "$WHEEL_NAME" \
              --arg wheel_digest "sha256:${WHEEL_SHA256}" \
              --argjson wheel_size "$wheel_size" \
              --arg sdist_name "$SDIST_NAME" \
              --arg sdist_digest "sha256:${SDIST_SHA256}" \
              --argjson sdist_size "$sdist_size" '
                .tag_name == $tag and
                .draft == false and
                .prerelease == $prerelease and
                (.assets | type == "array" and length == 2) and
                ([.assets[] | select(
                  .name == $wheel_name and
                  .state == "uploaded" and
                  .size == $wheel_size and
                  .digest == $wheel_digest
                )] | length == 1) and
                ([.assets[] | select(
                  .name == $sdist_name and
                  .state == "uploaded" and
                  .size == $sdist_size and
                  .digest == $sdist_digest
                )] | length == 1)
              ' >/dev/null
          }

          if release_state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}" 2>/dev/null); then
            if ! verify_release <<< "$release_state"; then
              echo "Existing release state or assets do not match the verified build." >&2
              exit 1
            fi
            echo "Release ${RELEASE_TAG} already contains the verified package assets."
          else
            if [[ "$PRERELEASE" == "true" ]]; then
              release_flags=(--prerelease)
            else
              release_flags=()
            fi

            notes_file="$RUNNER_TEMP/release-notes.md"
            notes_path="launch/RELEASE-${RELEASE_TAG}.md"
            if gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/${notes_path}?ref=${TAG_COMMIT}" \
              > "$notes_file" 2>/dev/null; then
              notes_flags=(--notes-file "$notes_file")
            else
              notes_flags=(--generate-notes)
            fi

            gh release create "$RELEASE_TAG" \
              "dist/${WHEEL_NAME}" \
              "dist/${SDIST_NAME}" \
              "${release_flags[@]}" \
              "${notes_flags[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "SAM Doctor ${RELEASE_TAG}"

            release_state=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${encoded_tag}")
            if ! verify_release <<< "$release_state"; then
              echo "New release did not preserve the verified package assets." >&2
              exit 1
            fi
          fi

      - name: Dispatch stable publishing and update the major tag
        if: ${{ needs.build.outputs.prerelease == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          TAG_COMMIT: ${{ needs.build.outputs.tag_commit }}
          DEFAULT_BRANCH: ${{ needs.build.outputs.default_branch }}
        run: |
          set -euo pipefail

          gh workflow run pypi-publish.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f release-tag="$RELEASE_TAG"

          if v0_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0" 2>/dev/null); then
            v0_type=$(jq -r '.object.type' <<< "$v0_ref")
            v0_commit=$(jq -r '.object.sha' <<< "$v0_ref")
            if [[ "$v0_type" != "commit" || ! "$v0_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "The v0 tag does not resolve directly to a commit." >&2
              exit 1
            fi

            if [[ "$v0_commit" == "$TAG_COMMIT" ]]; then
              echo "v0 already points to ${RELEASE_TAG}."
            else
              comparison=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${v0_commit}...${TAG_COMMIT}")
              merge_base=$(jq -r '.merge_base_commit.sha' <<< "$comparison")
              if [[ "$merge_base" == "$v0_commit" ]]; then
                gh api --method PATCH \
                  "repos/${GITHUB_REPOSITORY}/git/refs/tags/v0" \
                  -f sha="$TAG_COMMIT" \
                  -F force=true >/dev/null
              elif [[ "$merge_base" == "$TAG_COMMIT" ]]; then
                echo "v0 already points to a newer stable release; leaving it unchanged."
              else
                echo "The requested release and current v0 tag are on divergent histories." >&2
                exit 1
              fi
            fi
          else
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref='refs/tags/v0' \
              -f sha="$TAG_COMMIT" >/dev/null
          fi
