name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/sync-site-metadata.py --check
      # --tag makes the pushed tag part of the readiness check. Without it, a tag
      # disagreeing with the packaged version builds the packaged version,
      # attaches it to the tag anyway, and then hits PyPI's skip-existing path -
      # publishing a release tagged for a version it does not contain, with
      # nothing failing along the way.
      - run: python scripts/check-launch-readiness.py --repo jakegold1647/sam-doctor --token "${{ github.token }}" --tag "${{ github.ref_name }}"
      - run: python -m pip install build
      - run: python -m build
      - name: Create release with package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$TAG" == *-* ]]; then
            release_flags=(--prerelease)
          else
            release_flags=()
          fi

          notes_file="launch/RELEASE-${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping publish step."
            exit 0
          fi

          if [ -f "$notes_file" ]; then
            gh release create "$TAG" dist/* "${release_flags[@]}" --title "SAM Doctor ${TAG}" --notes-file "$notes_file"
          else
            gh release create "$TAG" dist/* "${release_flags[@]}" --title "SAM Doctor ${TAG}" --generate-notes
          fi

          if [[ "$TAG" != *-* ]]; then
            # Dispatch from the default branch so the current workflow definition
            # is available even when this tag predates workflow_dispatch support.
            gh workflow run pypi-publish.yml \
              --ref main \
              -f release-tag="$TAG"

            # Keep major action tag current for downstream CI users.
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f v0 "$TAG"
            git push origin v0 --force
          fi
