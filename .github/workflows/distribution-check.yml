name: Distribution health check

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      strict-distribution-during-release:
        description: "Enable full release-channel strictness checks"
        required: false
        default: "false"
      strict-ethical-check:
        description: "Enable strict ethical check using outreach data"
        required: false
        default: "false"
      ethical-min-feedback-ratio:
        description: "Minimum percentage of voluntary stars with feedback for strict ethical checks"
        required: false
        default: "100"
      allow-no-data-in-strict:
        description: "Allow strict ethical checks to pass when outreach data is still empty"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run distribution snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRICT_DURING_RELEASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['strict-distribution-during-release'] == 'true' }}
          STRICT_ETHICAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['strict-ethical-check'] == 'true' }}
          ETHICAL_MIN_FEEDBACK_RATIO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['ethical-min-feedback-ratio'] || '100' }}
          ALLOW_NO_DATA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['allow-no-data-in-strict'] == 'true' }}
        run: |
          strict_flags=""
          if [ "$STRICT_DURING_RELEASE" = "true" ]; then
            strict_flags="--strict-distribution-during-release"
          fi
          if [ "$STRICT_ETHICAL" = "true" ]; then
            strict_flags="$strict_flags --strict-ethical --min-feedback-ratio ${ETHICAL_MIN_FEEDBACK_RATIO}"
            if [ "$ALLOW_NO_DATA" = "true" ]; then
              strict_flags="$strict_flags --allow-no-data-in-strict"
            fi
          fi

          mkdir -p artifacts
          python scripts/check-launch.py \
            --repo-root "${{ github.workspace }}" \
            --repo "jakegold1647/sam-doctor" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --check-launch-token "${{ secrets.GITHUB_TOKEN }}" \
            --launch-repo "jakegold1647/sam-doctor" \
            --outreach-log launch/outreach-log-template.csv \
            $strict_flags \
            --output-format json \
            --output artifacts/distribution.json \
            --append-csv artifacts/distribution.csv \
            --print-trend \
            --summary artifacts/distribution-summary.md \
            --outreach-summary artifacts/outreach-summary.md
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-snapshot
          path: |
            artifacts/distribution.json
            artifacts/distribution.csv
            artifacts/distribution-summary.md
            artifacts/outreach-summary.md
          retention-days: 90
