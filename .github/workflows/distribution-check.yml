name: Distribution health check

on:
  schedule:
    - cron: "0 */12 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      strict-distribution-during-release:
        description: "Enable full release-channel strictness checks"
        required: false
        default: "false"
      strict-ethical:
        description: "Enable strict ethical outreach threshold check"
        required: false
        default: "false"
      min-feedback-ratio:
        description: "Minimum feedback ratio for --strict-ethical (percentage)"
        required: false
        default: "100"
      release-tag:
        description: Stable release tag that triggered this health check
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run distribution snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRICT_DURING_RELEASE: >-
            ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['strict-distribution-during-release'] == 'true' }}
          STRICT_ETHICAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['strict-ethical'] == 'true' }}
          MIN_FEEDBACK_RATIO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs['min-feedback-ratio'] || '100' }}
          RELEASED_FROM_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release-tag || '' }}
        run: |
          if [ "$RELEASED_FROM_TAG" != "" ] && [ "$STRICT_ETHICAL" != "true" ]; then
            STRICT_ETHICAL=""
          fi

          mkdir -p notes
          python scripts/bootstrap-outreach-log.py notes/sam-doctor-outreach-log.csv

          launch_flags=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            launch_flags="--skip-release-state"
          fi

          strict_flags=""
          if [ "$STRICT_DURING_RELEASE" = "true" ]; then
            strict_flags="--strict-distribution-during-release"
          fi
          ethical_flags=""
          if [ "$STRICT_ETHICAL" = "true" ]; then
            ethical_flags="--strict-ethical --min-feedback-ratio ${MIN_FEEDBACK_RATIO}"
          fi

          mkdir -p artifacts
          python scripts/check-launch.py \
            --repo-root "${{ github.workspace }}" \
            --repo "jakegold1647/sam-doctor" \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --check-launch-token "${{ secrets.GITHUB_TOKEN }}" \
            --launch-repo "jakegold1647/sam-doctor" \
            --outreach-log notes/sam-doctor-outreach-log.csv \
            $launch_flags \
            $strict_flags \
            --output-format json \
            --output artifacts/distribution.json \
            --append-csv artifacts/distribution.csv \
            --print-trend \
            --summary artifacts/distribution-summary.md \
            --outreach-summary artifacts/outreach-summary.md \
            $ethical_flags
      - name: Upload snapshot
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: distribution-snapshot
          path: |
            artifacts/distribution.json
            artifacts/distribution.csv
            artifacts/distribution-summary.md
            artifacts/outreach-summary.md
          retention-days: 90
