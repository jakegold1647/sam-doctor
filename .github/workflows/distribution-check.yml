name: Distribution health check

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run distribution snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          python scripts/check-launch-readiness.py --token "${{ secrets.GITHUB_TOKEN }}" | tee artifacts/launch-readiness-check.txt
          python scripts/check-launch.py \
            --outreach-log launch/outreach-log-template.csv \
            --output-format json \
            --output artifacts/distribution.json \
            --append-csv artifacts/distribution.csv \
            --print-trend \
            --token "${{ secrets.GITHUB_TOKEN }}" \
            --summary artifacts/distribution-summary.md \
            --outreach-summary artifacts/outreach-summary.md
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-snapshot
          path: |
            artifacts/distribution.json
            artifacts/distribution.csv
            artifacts/distribution-summary.md
            artifacts/outreach-summary.md
            artifacts/launch-readiness-check.txt
          retention-days: 90
