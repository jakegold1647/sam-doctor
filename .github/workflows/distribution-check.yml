name: Distribution health check

on:
  schedule:
    - cron: "0 12 * * 1,5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run distribution snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          python scripts/check-distribution.py --output-format json --output artifacts/distribution.json
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-snapshot
          path: artifacts/distribution.json
          retention-days: 90
