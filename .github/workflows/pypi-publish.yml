name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sam-doctor/
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Trigger strict post-release launch health check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run distribution-check.yml \
            --ref "${{ github.event.release.tag_name }}" \
            -f strict-distribution-during-release=true \
            -f strict-ethical=false \
            -f min-feedback-ratio=100
