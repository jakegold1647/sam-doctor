name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Stable GitHub release tag to publish to PyPI (for example, v0.11.0)
        required: true
        type: string

permissions: {}

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      tag_commit: ${{ steps.validate.outputs.tag_commit }}
      trusted_commit: ${{ steps.validate.outputs.trusted_commit }}
      validator_sha256: ${{ steps.validate.outputs.validator_sha256 }}
      wheel_asset_id: ${{ steps.validate.outputs.wheel_asset_id }}
      wheel_name: ${{ steps.validate.outputs.wheel_name }}
      wheel_digest: ${{ steps.validate.outputs.wheel_digest }}
      wheel_size: ${{ steps.validate.outputs.wheel_size }}
      sdist_asset_id: ${{ steps.validate.outputs.sdist_asset_id }}
      sdist_name: ${{ steps.validate.outputs.sdist_name }}
      sdist_digest: ${{ steps.validate.outputs.sdist_digest }}
      sdist_size: ${{ steps.validate.outputs.sdist_size }}
    steps:
      - name: Resolve immutable default-branch source
        id: trusted-source
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail

          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')
          if [[ -z "$default_branch" ]]; then
            echo "The repository does not report a default branch." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/${default_branch}" ]]; then
            echo "Manual recovery must dispatch this workflow from the default branch (${default_branch})." >&2
            exit 1
          fi

          encoded_default_branch=$(printf '%s' "$default_branch" | jq -sRr @uri)
          default_ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_default_branch}")
          target_type=$(jq -r '.object.type' <<< "$default_ref")
          trusted_commit=$(jq -r '.object.sha' <<< "$default_ref")
          if [[ "$target_type" != "commit" || ! "$trusted_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The default branch did not resolve to an immutable commit." >&2
            exit 1
          fi
          if [[ "$WORKFLOW_SHA" != "$trusted_commit" ]]; then
            echo "The dispatched workflow is stale relative to the default-branch head; dispatch it again." >&2
            exit 1
          fi
          printf 'commit=%s\n' "$trusted_commit" >> "$GITHUB_OUTPUT"

      - name: Check out trusted validator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.trusted-source.outputs.commit }}
          persist-credentials: false
          fetch-depth: 1

      - name: Validate immutable release artifacts before approval
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          TRUSTED_COMMIT: ${{ steps.trusted-source.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/validate-pypi-release.py validate \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --trusted-commit "$TRUSTED_COMMIT" \
            --output-dir "$RUNNER_TEMP/validated-dist" \
            --github-output "$GITHUB_OUTPUT"

  publish:
    needs: validate-release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/sam-doctor/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Fetch the trusted validator from its immutable commit
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_COMMIT: ${{ needs.validate-release.outputs.trusted_commit }}
          VALIDATOR_SHA256: ${{ needs.validate-release.outputs.validator_sha256 }}
          VALIDATOR_PATH: ${{ runner.temp }}/validate-pypi-release.py
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/${GITHUB_REPOSITORY}/contents/scripts/validate-pypi-release.py?ref=${TRUSTED_COMMIT}" \
            > "$VALIDATOR_PATH"
          printf '%s  %s\n' "$VALIDATOR_SHA256" "$VALIDATOR_PATH" | sha256sum --check --strict

      - name: Re-download and recheck the approved immutable assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
          VERSION: ${{ needs.validate-release.outputs.version }}
          TAG_COMMIT: ${{ needs.validate-release.outputs.tag_commit }}
          WHEEL_ASSET_ID: ${{ needs.validate-release.outputs.wheel_asset_id }}
          WHEEL_NAME: ${{ needs.validate-release.outputs.wheel_name }}
          WHEEL_DIGEST: ${{ needs.validate-release.outputs.wheel_digest }}
          WHEEL_SIZE: ${{ needs.validate-release.outputs.wheel_size }}
          SDIST_ASSET_ID: ${{ needs.validate-release.outputs.sdist_asset_id }}
          SDIST_NAME: ${{ needs.validate-release.outputs.sdist_name }}
          SDIST_DIGEST: ${{ needs.validate-release.outputs.sdist_digest }}
          SDIST_SIZE: ${{ needs.validate-release.outputs.sdist_size }}
          VALIDATOR_PATH: ${{ runner.temp }}/validate-pypi-release.py
        run: |
          set -euo pipefail
          python3 "$VALIDATOR_PATH" recheck \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --version "$VERSION" \
            --tag-commit "$TAG_COMMIT" \
            --wheel-asset-id "$WHEEL_ASSET_ID" \
            --wheel-name "$WHEEL_NAME" \
            --wheel-digest "$WHEEL_DIGEST" \
            --wheel-size "$WHEEL_SIZE" \
            --sdist-asset-id "$SDIST_ASSET_ID" \
            --sdist-name "$SDIST_NAME" \
            --sdist-digest "$SDIST_DIGEST" \
            --sdist-size "$SDIST_SIZE" \
            --output-dir dist

      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          # A recovery run for an already-published release is a safe no-op.
          skip-existing: true
