name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Stable GitHub release tag to publish to PyPI (for example, v0.7.5)
        required: true
        type: string

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sam-doctor/
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual recovery is dispatched from main, but must build the
          # release tag supplied by the operator rather than current main.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release-tag || github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Trigger strict post-release launch health check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release-tag || github.event.release.tag_name }}
        run: |
          gh workflow run distribution-check.yml \
            --ref main \
            -f release-tag="$RELEASE_TAG" \
            -f strict-distribution-during-release=true \
            -f strict-ethical=false \
            -f min-feedback-ratio=100
