name: Community queue check

# This is a networked maintainer signal, not part of the offline PR gate. It
# catches queue drift before a newcomer lands on an issue that is not actually
# ready or no longer has a clear person to ask for help. Issue events and
# comments make the check immediate when labels, assignment, state, scope, or
# a contributor claim changes; the weekly run remains a backstop.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
  issues:
    types: [assigned, unassigned, labeled, unlabeled, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check ready issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python scripts/check-community-queue.py \
            --repo "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --format github | tee queue-check.txt
      - name: Publish queue summary
        if: always()
        run: |
          {
            echo "## Community queue check"
            echo
            cat queue-check.txt || echo "(no output captured)"
          } >> "$GITHUB_STEP_SUMMARY"
