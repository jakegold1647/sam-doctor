name: Verify free core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: rm -rf dist
      - run: python -m build
      - name: Verify the built wheel in a clean environment
        run: |
          wheel_file="$(python - <<'PY'\nfrom pathlib import Path\n\npaths = sorted(Path('dist').glob('*.whl'))\nif not paths:\n    raise SystemExit('No wheel artifacts found in dist/')\nprint(paths[-1])\nPY\n)"
          if [ ! -f "$wheel_file" ]; then
            echo "No wheel artifact found in dist/"
            exit 1
          fi

          python -m venv .wheel-verify
          .wheel-verify/bin/python -m pip install --disable-pip-version-check "$wheel_file"
          .wheel-verify/bin/python -m sam_doctor.cli demo --format json --output /tmp/cli-demo.json
          .wheel-verify/bin/python - <<'PY'
import json
from pathlib import Path

payload = json.loads(Path("/tmp/cli-demo.json").read_text(encoding="utf-8"))
          if payload.get("finding_count") != 1:
              raise SystemExit(f"Expected exactly 1 finding in demo output, got {payload.get('finding_count')}")
          print("CLI sample check passed.")
          PY
          .wheel-verify/bin/python -m sam_doctor.cli demo
      - run: python -m sam_doctor.cli demo
      - id: action-check
        uses: ./
        with:
          log-file: examples/oidc-assume-role-failure.txt
          summary: "true"
      - name: Assert expected finding count from bundled sample
        run: |
          python - <<'PY'
          raw_count = """${{ steps.action-check.outputs.finding-count }}""".strip()
          if not raw_count:
            raise SystemExit("finding-count output was empty")

          try:
            finding_count = int(raw_count)
          except ValueError as exc:
            raise SystemExit(f"Invalid finding-count output: {raw_count}") from exc

          if finding_count != 1:
            raise SystemExit(f"Expected 1 finding, got {finding_count}")
          PY
