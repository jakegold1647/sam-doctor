name: Verify free core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run website QA checks
        run: python scripts/check-site-qa.py

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: python scripts/sync-site-metadata.py --check
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
      - run: rm -rf dist
      - run: python -m build
      - name: Verify the built wheel in a clean environment
        run: |
          wheel_file="$(python -c 'from pathlib import Path; paths = sorted(Path("dist").glob("*.whl")); assert paths, "No wheel artifacts found in dist/"; print(paths[-1])')"
          if [ ! -f "$wheel_file" ]; then
            echo "No wheel artifact found in dist/"
            exit 1
          fi

          python -m venv .wheel-verify
          .wheel-verify/bin/python -m pip install --disable-pip-version-check "$wheel_file"
          .wheel-verify/bin/python -m sam_doctor.cli demo --format json --output /tmp/cli-demo.json
          .wheel-verify/bin/python -c 'import json; from pathlib import Path; payload=json.loads(Path("/tmp/cli-demo.json").read_text(encoding="utf-8")); findings=payload.get("finding_count"); assert findings == 1, f"Expected exactly 1 finding in demo output, got {findings}"; print("CLI sample check passed.")'
          .wheel-verify/bin/python -m sam_doctor.cli demo
      - run: python -m sam_doctor.cli demo
      - id: action-check
        uses: ./
        with:
          log-file: examples/oidc-assume-role-failure.txt
          summary: "true"
      - name: Assert expected finding count from bundled sample
        run: |
          python -c 'raw_count = """${{ steps.action-check.outputs.finding-count }}""".strip(); assert raw_count, "finding-count output was empty"; finding_count=int(raw_count); assert finding_count == 1, f"Expected 1 finding, got {finding_count}"'

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run onboarding smoke check
        run: python scripts/run-smoke.py
