name: Verify free core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m build
      - name: Verify the built wheel in a clean environment
        run: |
          python -m venv .wheel-verify
          .wheel-verify/bin/python -m pip install dist/*.whl
          .wheel-verify/bin/sam-doctor demo
      - run: sam-doctor demo
      - id: action-check
        uses: ./
        with:
          log-file: examples/oidc-assume-role-failure.txt
          summary: "true"
      - name: Assert expected finding count from bundled sample
        run: |
          python - <<'PY'
          finding_count = int("${{ steps.action-check.outputs.finding-count }}".strip())
          if finding_count != 1:
              raise SystemExit(f"Expected 1 finding, got {finding_count}")
          PY
