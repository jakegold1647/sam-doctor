name: Verify free core

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  site-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run website QA checks
        run: python scripts/check-site-qa.py

  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: python scripts/sync-site-metadata.py --check
      - run: python -m ruff check src tests scripts
      - name: Rule catalog quality gate (annotated)
        run: python scripts/check-rule-catalog.py --format github
      - name: Rule fixture registry gate (annotated)
        run: python scripts/check-rule-fixtures.py --format github
      - name: Error page mapping gate (annotated)
        run: python scripts/check-error-pages.py --format github
      - run: python -m pytest -q --cov
      - run: rm -rf dist
      - run: python -m build
      # Was an inline bash block, which scripts/check-pr.py had no way to mirror,
      # so this gate existed only in CI and the local gate silently lacked it. It
      # also chose the wheel with `sorted(...)[-1]`, a lexicographic sort in which
      # 0.9.0 beats 0.11.0; the script selects by packaged version instead, and
      # additionally exercises the installed console script.
      - name: Verify the built wheel in a clean environment
        run: python scripts/verify-wheel.py
      - run: python -m sam_doctor.cli demo
      - id: action-check
        uses: ./
        with:
          log-file: examples/oidc-assume-role-failure.txt
          summary: "true"
      - name: Assert expected finding count from bundled sample
        run: |
          python -c 'raw_count = """${{ steps.action-check.outputs.finding-count }}""".strip(); assert raw_count, "finding-count output was empty"; finding_count=int(raw_count); assert finding_count == 1, f"Expected 1 finding, got {finding_count}"'

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python scripts/check-rule-catalog.py
      - run: python scripts/check-rule-fixtures.py
      - run: python scripts/check-error-pages.py
      # The action-wrapper tests skip themselves here: they need a WSL-style
      # bash, and the composite action is exercised directly below instead.
      - run: python -m pytest -q --cov
      - run: python -m sam_doctor.cli demo
      - name: Exercise batch, packet, and init path handling on Windows paths
        shell: bash
        run: |
          python -m sam_doctor.cli batch src/sam_doctor/data --format json --output batch-windows.json
          python -c "import json; payload = json.load(open('batch-windows.json', encoding='utf-8')); assert payload['batch_count'] >= 5, payload; print('batch ok:', payload['batch_count'], 'files')"
          python -m sam_doctor.cli packet src/sam_doctor/data/oidc-assume-role-failure.txt --output-dir packet-windows
          python -m sam_doctor.cli init --workflow-file init-windows/sam-doctor.yml
      - id: action-check-windows
        uses: ./
        with:
          log-file: examples/oidc-assume-role-failure.txt
          summary: "true"
      - name: Assert expected finding count from bundled sample
        shell: bash
        run: |
          python -c 'raw_count = """${{ steps.action-check-windows.outputs.finding-count }}""".strip(); assert raw_count, "finding-count output was empty"; finding_count=int(raw_count); assert finding_count == 1, f"Expected 1 finding, got {finding_count}"'

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run onboarding smoke check
        run: python scripts/run-smoke.py
