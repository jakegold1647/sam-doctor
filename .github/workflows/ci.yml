name: Verify free core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Select workflow python executable
        run: |
          set -euo pipefail

          MATRIX_PYTHON_VERSION="${{ matrix.python-version }}"
          CLEAN_VERSION="${MATRIX_PYTHON_VERSION//./}"
          CANDIDATES=(
            "python$MATRIX_PYTHON_VERSION"
            "python$CLEAN_VERSION"
            "python3"
            "python"
          )

          for candidate in "${CANDIDATES[@]}"; do
            if ! command -v "$candidate" >/dev/null 2>&1; then
              continue
            fi

            actual_version="$("$candidate" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
            if [ "$actual_version" = "$MATRIX_PYTHON_VERSION" ]; then
              PYTHON_CMD="$candidate"
              break
            fi

            echo "Skipping ${candidate}: reports Python ${actual_version}, expected ${MATRIX_PYTHON_VERSION}" >&2
          done

          if [ -z "${PYTHON_CMD:-}" ]; then
            echo "Unable to find a Python executable matching ${MATRIX_PYTHON_VERSION}." >&2
            echo "Checked candidates: ${CANDIDATES[*]}" >&2
            exit 1
          fi

          "$PYTHON_CMD" --version
          echo "PYTHON_CMD=$PYTHON_CMD" >> "$GITHUB_ENV"
      - run: ${{ env.PYTHON_CMD }} -m pip install ".[dev]"
      - run: ${{ env.PYTHON_CMD }} -m pytest -q
      - run: rm -rf dist
      - run: ${{ env.PYTHON_CMD }} -m build
      - name: Verify the built wheel in a clean environment
        run: |
          set -euo pipefail

          wheel_file="$(${{ env.PYTHON_CMD }} -c 'from pathlib import Path; paths = sorted(Path("dist").glob("*.whl")); assert paths, "No wheel artifacts found in dist/"; print(paths[-1])')"
          if [ ! -f "$wheel_file" ]; then
            echo "No wheel artifact found in dist/"
            exit 1
          fi

          tmp_demo_report="$(mktemp)"
          ${{ env.PYTHON_CMD }} -m venv .wheel-verify

          .wheel-verify/bin/pip install --disable-pip-version-check "$wheel_file"

          if ! ./.wheel-verify/bin/python -m sam_doctor.cli demo --format json --output "$tmp_demo_report"; then
            echo "Wheel smoke-check command failed; dumped command output:"
            if [ -f "$tmp_demo_report" ]; then
              cat "$tmp_demo_report" >&2
            else
              echo "(No report file was written.)" >&2
            fi
            exit 1
          fi

          if [ ! -s "$tmp_demo_report" ]; then
            echo "Wheel smoke-check command produced an empty report at $tmp_demo_report" >&2
            exit 1
          fi

          ./.wheel-verify/bin/python - <<PY
          import json
          from pathlib import Path

          payload = json.loads(Path("$tmp_demo_report").read_text(encoding="utf-8"))
          if payload.get("finding_count") != 1:
              raise SystemExit(f"Expected exactly 1 finding in demo output, got {payload.get('finding_count')}")
          print("CLI sample check passed.")
          PY

          rm -f "$tmp_demo_report"
          rm -rf .wheel-verify
      - run: ${{ env.PYTHON_CMD }} -m sam_doctor.cli demo
      - id: action-check
        uses: ./
        with:
          log-file: examples/oidc-assume-role-failure.txt
          summary: "true"
      - name: Assert expected finding count from bundled sample
        run: |
          ${{ env.PYTHON_CMD }} - <<'PY'
          raw_count = """${{ steps.action-check.outputs.finding-count }}""".strip()
          if not raw_count:
            raise SystemExit("finding-count output was empty")

          try:
            finding_count = int(raw_count)
          except ValueError as exc:
            raise SystemExit(f"Invalid finding-count output: {raw_count}") from exc

          if finding_count != 1:
            raise SystemExit(f"Expected 1 finding, got {finding_count}")
          PY
