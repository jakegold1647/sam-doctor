[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-doctor"
version = "0.7.7"
description = "Local, evidence-first diagnostics for AWS SAM and GitHub Actions deployment failures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jacob Goldstein"}]
keywords = [
    "aws",
    "cloudformation",
    "github-actions",
    "iam",
    "sam",
    "serverless",
    "lambda",
    "oidc",
    "deployment",
    "diagnostics",
    "troubleshooting",
    "ci",
    "devops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jakegold1647.github.io/sam-doctor/"
Repository = "https://github.com/jakegold1647/sam-doctor"
Documentation = "https://github.com/jakegold1647/sam-doctor/tree/main/docs"
Issues = "https://github.com/jakegold1647/sam-doctor/issues"
Changelog = "https://github.com/jakegold1647/sam-doctor/blob/main/CHANGELOG.md"

[project.scripts]
sam-doctor = "sam_doctor.cli:main"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.6", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sam_doctor = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Keep in sync with requires-python: stops lint from suggesting APIs
# (e.g. datetime.UTC) that do not exist on the oldest supported Python.
target-version = "py310"
