[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam-doctor"
version = "0.12.1"
description = "Local, evidence-first diagnostics for AWS SAM, AWS CDK, CloudFormation, and GitHub Actions deployment failures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jacob Goldstein"}]
keywords = [
    "aws",
    "cloudformation",
    "aws sam",
    "sam",
    "aws-cdk",
    "github-actions",
    "iam",
    "github marketplace action",
    "serverless",
    "lambda",
    "oidc",
    "deployment",
    "diagnostics",
    "troubleshooting",
    "ci",
    "devops",
    "deployment diagnostics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://sam-doctor.jacobgoldstein.dev/"
Repository = "https://github.com/jakegold1647/sam-doctor"
Documentation = "https://github.com/jakegold1647/sam-doctor/tree/main/docs"
Issues = "https://github.com/jakegold1647/sam-doctor/issues"
Changelog = "https://github.com/jakegold1647/sam-doctor/blob/main/CHANGELOG.md"
"GitHub Actions" = "https://github.com/marketplace/actions/sam-doctor-aws-deployment-diagnostics"
"Researcher Overview" = "https://github.com/jakegold1647/sam-doctor/blob/main/RESEARCHER_OVERVIEW.md"

[project.scripts]
sam-doctor = "sam_doctor.cli:main"

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.6", "jsonschema>=4", "pyyaml>=6", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sam_doctor = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sam_doctor"]
omit = [
    # Exercised by tests/test_module_entry_point.py, which runs `python -m
    # sam_doctor` in a subprocess - coverage cannot observe that, so leaving it in
    # would report 0% for a file that is genuinely tested and drag the floor down
    # for the wrong reason.
    "*/sam_doctor/__main__.py",
]

[tool.coverage.report]
show_missing = true
# Measured at 96% when this floor was introduced. The number is deliberately a few
# points below that: high enough that deleting a test suite fails, loose enough
# that one uncovered error branch does not block an unrelated fix. Raise it when
# the real figure rises, rather than treating it as a target to game.
fail_under = 93

[tool.ruff]
# Keep in sync with requires-python: stops lint from suggesting APIs
# (e.g. datetime.UTC) that do not exist on the oldest supported Python.
target-version = "py310"
